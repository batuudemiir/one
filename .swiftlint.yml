# SwiftLint Configuration — ONE
# Marka & kalite disiplinini kod düzeyinde zorunlu kılar.
# Faz 1 (2026-04-26): hardcoded font/hex/spring borcu birikmesin diye eklendi.

# Tarama kapsamı
included:
  - one/one

excluded:
  - one/build
  - one/build_new
  - one/.build
  - one/Pods
  - one/Carthage
  - one/DerivedData
  - one/oneTests
  - one/oneUITests

# Kapatılan default kurallar (proje şu anki durumu dikkate alarak)
disabled_rules:
  - trailing_whitespace
  - line_length          # later: enable, set to 140
  - identifier_name      # mood/event sample data id'leri kısa
  - todo                 # TODO yorumları için ayrı disiplin

# Faz 3'te aktive olacak kurallar (şimdilik warning)
opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - sorted_first_last
  - contains_over_first_not_nil
  - explicit_init
  - closure_spacing
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - toggle_bool

# Dosya/tip uzunluk sınırları
file_length:
  warning: 600
  error: 1200      # Faz 3'te 500/1000'e indirilecek; şu an massive view'lar için tolerans

type_body_length:
  warning: 400
  error: 800       # Faz 3'te 300/600'e indirilecek

function_body_length:
  warning: 60
  error: 120

cyclomatic_complexity:
  warning: 15
  error: 25

# ONE'a özel custom rule'lar — borç birikmesini engeller
custom_rules:

  one_no_system_font_size:
    name: "ONE: hardcoded system font yasak"
    regex: '\.font\(\.system\(size:'
    message: "ONETypography token'larını kullan: .font(ONETypography.bodyMD), .displayLG() vb. Dynamic Type için relativeTo: gerekli."
    severity: warning   # Faz 1: warning (mevcut 311 occurrence migrate sırasında error'a çıkacak)

  one_no_inline_color_hex:
    name: "ONE: inline Color(hex:) yasak"
    regex: '(?<!//.*)(?<!let \w{1,30} = )Color\(hex:\s*"'
    message: "ONETokens.<token> kullan veya yeni token ekle. Inline Color(hex:) marka tutarsızlığına yol açar."
    severity: warning
    excluded:
      - "one/one/UI/DesignSystem/ONETokens.swift"
      - "one/one/UI/DesignSystem/Color+ONE.swift"
      - "one/one/Core/Models/ScreenType.swift"      # demo sample data
      - "one/one/Features/Share/InviteShareCard.swift"  # bilinçli sabit koyu kart
      - "one/one/Features/YearlySummary/YearlySummaryViewModel.swift"  # dekoratif gradyan paleti

  one_no_raw_animation_spring:
    name: "ONE: raw Animation.spring yasak"
    regex: 'Animation\.spring\(response:'
    message: "ONEAnimation.cardSpring / panelSpring / tabSwitch / screenTransition kullan."
    severity: warning
    excluded:
      - "one/one/UI/DesignSystem/ONEAnimation.swift"

  one_no_uiimpact_direct:
    name: "ONE: doğrudan UIImpactFeedbackGenerator yasak"
    regex: 'UIImpactFeedbackGenerator\('
    message: "ONEHaptics.* kullan (mood-aware + reduceMotion gating var)."
    severity: warning
    excluded:
      - "one/one/UI/DesignSystem/ONEHaptics.swift"

# Yapılandırma sonu
reporter: "xcode"
