<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>ONE 2.0</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--ground); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; width:960px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--brand); }
  .aksam { fill:var(--aksam); }
  .sabah { fill:var(--sabah); }
  .cut { fill:var(--ground); }
  .raised { fill:var(--surface); }
  .blk { rx:var(--radius-lg); }
  .hz { stroke:var(--ink); stroke-width:1.5; }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-sans); font-size:100px; line-height:.92; font-weight:700; letter-spacing:-.035em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      brand 176×248 · surface 128×80 (the dark card tone, cut with radius-lg) bled off the top (the one ink colour, largest) · aksam 128×144 · sabah 144×208 bled off the right edge — ≈32% of 960×288
  arrangement one tall ink slab with two satellites, bottoms on one line space-8 above the edge, space-4 gutters
  pattern     a literal motif — the day's two lights from README principle 1: a rising half-disc cut into sabah, a sinking half-disc of sabah inside aksam, one ink horizon hairline crossing both at the same height
  scales      gutters space-4; bottoms at 288 − space-8; corners radius-lg; disc radii 44 and 22 (space-10 + space-1, half of it)
-->
<rect class="brand blk" x="16" y="-20" width="176" height="276" rx="20"/>
<rect class="raised blk" x="208" y="16" width="128" height="80" rx="20"/>
<rect class="aksam blk" x="208" y="112" width="128" height="144" rx="20"/>
<rect class="sabah blk" x="352" y="48" width="148" height="208" rx="20"/>
<path class="cut" d="M382 200a44 44 0 0 1 88 0z"/>
<path class="sabah" d="M250 200a22 22 0 0 1 44 0z"/>
<line class="hz" x1="208" y1="200.75" x2="480" y2="200.75"/>
</svg>
</div>
<div class="words">
<p class="name">ONE 2.0</p>
<p class="tag">Sessiz, koyu bir defter; sesi yazının kendisi.</p>
</div>
</div>
</body>
</html>
