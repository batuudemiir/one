const T={ground:'#000000',surface:'#141416',raised:'#1E1E21',line:'#26262A',lineStrong:'#66666E',

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const prog=(t,a,d)=>clamp((t-a)/d);
const eo=p=>1-Math.pow(1-p,3);
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const lerp=(a,b,p)=>a+(b-a)*p;
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hex(h){return[1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const bay=(i,j)=>BAYER[(j&3)*4+(i&3)];

function px(X,Y,w,h,col,a=1){if(a<=0)return;l.globalAlpha=a;l.fillStyle=col;l.fillRect(Math.round(X),Math.round(Y),Math.round(w),Math.round(h));l.globalAlpha=1}
function box(X,Y,w,h,col,a=1){X=Math.round(X);Y=Math.round(Y);px(X+1,Y,w-2,h,col,a);px(X,Y+1,1,h-2,col,a);px(X+w-1,Y+1,1,h-2,col,a)}

function sprite(rows,X,Y,pal,a=1){rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(pal[ch])px(X+i,Y+j,1,1,pal[ch],a)}))}

// yazı kuyruğu (yüksek çözünürlükte basılır)

function tx(s,X,Y,{size=8,color=T.ink,align='left',weight=400,a=1}={}){

function flushText(){

}
const typed=(s,t,a,cps=16)=>s.slice(0,Math.floor(clamp((t-a)*cps,0,s.length)));
function wrap(s,n){const w=s.split(' '),out=[];let cur='';for(const v of w){if((cur+' '+v).trim().length>n){out.push(cur);cur=v}else cur=(cur+' '+v).trim()}if(cur||!out.length)out.push(cur);return out}

const K={A:0,T:2.4,C:8.2,P:13.6,E:15.6,S:21,C2:23.2,EC:25.8,END:29};

function mix(a,b,p){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],p)).toString(16).padStart(2,'0')).join('')}
const SKY=[[0,'#070A1E','#141A3A'],[.25,'#2B2F6E','#E9A45A'],[.5,'#4D86D0','#A9CBEE'],[.75,'#3E2C6E','#E0783A'],[1,'#070A1E','#141A3A']];
function sky(d){let i=0;while(i<SKY.length-2&&d>SKY[i+1][0])i++;const [a,t1,b1]=SKY[i],[b,t2,b2]=SKY[i+1],p=(d-a)/(b-a);return[mix(t1,t2,p),mix(b1,b2,p)]}
const night=d=>clamp(1-Math.min(Math.abs(d-0)/.2,Math.abs(d-1)/.2));

function scene(t){
  const d=tod(t),[top,bot]=sky(d);
  // bantlı gökyüzü (piksel geçiş)
  const bands=14;for(let i=0;i<bands;i++)px(0,i*16,LW,16,mix(top,bot,i/(bands-1)));
  // yıldızlar
  const r=rng(4),n=night(d);for(let i=0;i<40;i++){const sx=r()*LW,sy=r()*150,tw=.5+.5*Math.sin(t*3+i);px(sx,sy,1,1,'#FFFFFF',n*tw)}
  // güneş ve ay yay üstünde
  const sa=(d-.2)/.6*Math.PI,sx=lerp(20,160,(d-.2)/.6),sy=190-Math.sin(clamp(sa,0,Math.PI))*150;
  if(d>.18&&d<.82){px(sx-6,sy-4,12,8,'#FFD479');px(sx-4,sy-6,8,12,'#FFD479');px(sx-5,sy-5,10,10,'#FFE6A6')}
  const ma=eo(prog(d,.82,.1));if(ma>0){const my=lerp(160,40,ma);sprite(['...####.....','..###.......','.###........','.##.........','###.........','###.........','###.........','###.........','.###......#.','.####....##.','..#########.','....#####...'],138,my,{'#':'#E8ECFF'},ma)}
  // bulutlar
  for(let i=0;i<3;i++){const cx=((i*70+t*4*(i+1))%240)-30,cy=40+i*28;const cc=mix('#FFFFFF',top,.35+.5*n);px(cx,cy,24,4,cc,.8);px(cx+5,cy-3,12,3,cc,.8)}
  // şehir silueti
  const rr=rng(9);let bx=0;const bc=mix('#141726','#05060C',n);
  while(bx<LW){const w=10+Math.floor(rr()*16),h=40+Math.floor(rr()*70);px(bx,LH-h-80,w,h+80,bc);
    for(let wy=LH-h-74;wy<LH-90;wy+=6)for(let wx=bx+2;wx<bx+w-2;wx+=4){const lit=rr()<lerp(.15,.55,n);if(lit)px(wx,wy,2,3,'#F2B84B',lerp(.35,.9,n))}
    bx+=w+1}
  px(0,LH-84,LW,84,'#05060A');
}

// el imleci
const HAND=['..##......','.#oo#.....','.#oo#.....','.#oo###...','.#oo#oo##.','##oo#oo#o#','#ooooooooo#','#oooooooo#.','.#oooooo#..','..######...'];
function hand(X,Y,press=0,a=1){sprite(HAND,X,Y+press,{'#':'#15181D','o':'#F4D7C0'},a)}
function tapRing(X,Y,p){if(p<=0||p>=1)return;const s=Math.round(4+p*10);frame(X-s/2,Y-s/2,s,s,'#FFFFFF',1-p)}
function handPath(t,keys){
  if(t<keys[0][0]||t>keys[keys.length-1][0]+.4)return;
  let i=0;while(i<keys.length-1&&t>keys[i+1][0])i++;
  const a=keys[i],b=keys[i+1]||a,dur=b===a?1:(a[3]==='drag'?b[0]-a[0]:Math.min(.45,b[0]-a[0]));
  const p=b===a?1:(a[3]==='drag'?eio(prog(t,a[0],dur)):eio(prog(t,a[0],dur)));
  const X=lerp(a[1],b[1],p),Y=lerp(a[2],b[2],p);
  const tapK=keys.find(k=>k[3]===1&&t>=k[0]&&t<k[0]+.5);
  const press=(tapK&&t-tapK[0]<.15)||a[3]==='drag'?1:0;
  if(tapK)tapRing(tapK[1],tapK[2],prog(t,tapK[0],.45));
  hand(X-2,Y-1,press,clamp((t-keys[0][0])/.2)*clamp((keys[keys.length-1][0]+.4-t)/.2));
}

const DAYS=L.days,TODAY=3; // Pzt 21 … Paz 27, bugün Perşembe 24
function tick(X,Y,col){[[0,2],[1,3],[2,4],[3,3],[4,2],[5,1],[6,0]].forEach(([dx,dy])=>px(X+dx,Y+dy,1,1,col))}
function weekStrip(Y,todayDone){
  const nums=[21,22,23,24,25,26,27],st=['done','done','gap','today','future','future','future'];
  for(let i=0;i<7;i++){const X=SC.x+4+i*13.1,s=st[i];
    tx(DAYS[i],X+6,Y,{size:4.2,color:s==='today'?T.ink:T.faint,align:'center'});
    if(s==='today'){frame(X,Y+2,12,12,T.lineStrong);if(todayDone)tick(X+3,Y+6,T.ink);else tx('24',X+6,Y+10.5,{size:5,align:'center',weight:700})}
    else if(s==='done')tick(X+3,Y+6,T.ink);
    else tx(String(nums[i]),X+6,Y+10.5,{size:5,color:T.faint,align:'center'})}
}

  box(SC.x+SC.w-26,Y0+202,18,10,T.primary);tx(L.write,SC.x+SC.w-17,Y0+209,{size:5,color:T.onPrimary,align:'center',weight:700});
  l.restore();
  for(let i=txtQ.length-1;i>=n0;i--){const y=txtQ[i][2];if(y<clipTop+5||y>clipBot)txtQ.splice(i,1)}

const R=rng(33),SCORES=['#5B6CCB','#8F99D0','#9A9C94','#E9B650','#F08A2E'];
const MONTH=Array.from({length:30},(_,i)=>{const d=i+1;if(d===23||d===9||d===16)return null;if(d>24)return undefined;
  if(d===24)return{c:'#E9B650',w:true,today:true};return{c:SCORES[Math.min(4,Math.floor(R()*5))],w:R()<.45}});
function monthView(t,fillT){
  tx(L.month,SC.x+5,SC.y+44,{size:7,weight:700});
  L.dshort.forEach((d,i)=>tx(d,SC.x+10+i*13,SC.y+55,{size:4.2,color:T.faint,align:'center'}));
  for(let d=1;d<=30;d++){const k=d+0,col=(k)%7,row=Math.floor(k/7),X=SC.x+4+col*13,Y=SC.y+59+row*15,m=MONTH[d-1];
    const isToday=d===24;
    if(m===undefined){tx(String(d),X+6,Y+8,{size:4.3,color:'#4A4A50',align:'center'});continue}
    box(X,Y,12,13,T.surface);
    if(isToday){frame(X,Y,12,13,T.lineStrong);const p=eo(prog(t,fillT,.4));if(p>0){const s=Math.round(6*p);box(X+6-s/2,Y+2+3-s/2+1,s,s,m.c);if(p>.9)px(X+10,Y+1,1,2,T.ink)}

  }

  box(SC.x+2,Y,SC.w-4,SC.y+SC.h-Y+2,T.surface);px(SC.x+SC.w/2-8,Y+4,16,2,T.lineStrong);
