<!doctype html>
<html><head><meta charset="utf-8"><title>ONE 2.0 hikâye</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#faf9f5}canvas{display:block}</style>
</head><body><canvas id="c" width="1080" height="1080"></canvas>
<script>
const W=1080,H=1080;
const c=document.getElementById('c'),x=c.getContext('2d');
const C={bg:'#faf9f5',ink:'#141413',mid:'#b0aea5',soft:'#e8e6dc',orange:'#d97757',blue:'#6a9bcc',green:'#788c5d'};
const SERIF="'Lora'",SANS="'Poppins'";

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const prog=(t,a,d)=>clamp((t-a)/d);
const eo=p=>1-Math.pow(1-p,3);
const eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const back=p=>{const s=1.5;return 1+(s+1)*Math.pow(p-1,3)+s*Math.pow(p-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

// ——— elle çizim: nokta dizileri, titreşim (boil), kısmi çizim ———
let BOIL=0;
function dens(pts,closed){ // noktaları ~5px aralıkla sıklaştır
  const out=[],n=pts.length,m=closed?n:n-1;
  for(let i=0;i<m;i++){const a=pts[i],b=pts[(i+1)%n],L=Math.hypot(b[0]-a[0],b[1]-a[1]),k=Math.max(1,Math.ceil(L/5));
    for(let j=0;j<k;j++)out.push([lerp(a[0],b[0],j/k),lerp(a[1],b[1],j/k)])}
  if(!closed)out.push(pts[n-1]);else out.push(out[0]);return out;
}
function rectP(cx,cy,w,h,r=0,rot=0){
  const p=[];const q=Math.min(r,w/2,h/2);
  const corners=[[w/2-q,-h/2+q,-Math.PI/2],[w/2-q,h/2-q,0],[-w/2+q,h/2-q,Math.PI/2],[-w/2+q,-h/2+q,Math.PI]];
  // sol üstten saat yönünde
  p.push([-w/2+q,-h/2]);
  for(const [ax,ay,a0] of corners){for(let k=0;k<=6;k++){const a=a0+k/6*Math.PI/2;p.push([ax+q*Math.cos(a),ay+q*Math.sin(a)])}}
  const cs=Math.cos(rot),sn=Math.sin(rot);
  return dens(p.map(([a,b])=>[cx+a*cs-b*sn,cy+a*sn+b*cs]),true);
}
function circP(cx,cy,r,a0=-Math.PI/2,a1=a0+Math.PI*2,ry=r){
  const n=Math.max(12,Math.ceil(Math.abs(a1-a0)*r/5)),p=[];
  for(let i=0;i<=n;i++){const a=lerp(a0,a1,i/n);p.push([cx+r*Math.cos(a),cy+ry*Math.sin(a)])}return p;
}
function lineP(...xy){const p=[];for(let i=0;i<xy.length;i+=2)p.push([xy[i],xy[i+1]]);return dens(p,false)}
function wob(pts,seed,amp){
  const b=BOIL;return pts.map(([a,bb],i)=>[a+amp*Math.sin(i*.13+seed*3.1+b*1.9),bb+amp*Math.cos(i*.11+seed*2.3+b*2.7)]);
}
function sk(pts,p,{c=C.ink,lw=4,fill=null,fa=0,seed=1,amp=1.1,alpha=1}={}){
  if(p<=0||alpha<=0)return;
  const w=wob(pts,seed,amp);
  x.save();x.globalAlpha*=alpha;x.lineCap='round';x.lineJoin='round';
  if(fill&&fa>0){x.save();x.globalAlpha*=fa;x.beginPath();w.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.fillStyle=fill;x.fill();x.restore()}
  let tot=0;const seg=[0];for(let i=1;i<w.length;i++){tot+=Math.hypot(w[i][0]-w[i-1][0],w[i][1]-w[i-1][1]);seg.push(tot)}
  const L=tot*clamp(p);x.beginPath();x.moveTo(...w[0]);
  for(let i=1;i<w.length;i++){if(seg[i]<=L)x.lineTo(...w[i]);else{const k=(L-seg[i-1])/(seg[i]-seg[i-1]);
    x.lineTo(lerp(w[i-1][0],w[i][0],k),lerp(w[i-1][1],w[i][1],k));break}}
  x.strokeStyle=c;x.lineWidth=lw;x.stroke();x.restore();
}
function text(s,px,py,{size=40,weight=400,color=C.ink,align='center',font=SERIF,alpha=1,italic=false,ls=0}={}){
  if(alpha<=0)return;x.save();x.globalAlpha*=alpha;x.font=`${italic?'italic ':''}${weight} ${size}px ${font}`;
  x.fillStyle=color;x.textAlign=align;x.letterSpacing=ls+'px';x.fillText(s,px,py);x.restore();
}
// anlatı cümlesi: kelime kelime belirir
function caption(t,s,at=.6,y=905){
  const words=s.split(' ');x.save();x.font=`400 50px ${SERIF}`;
  const fs=Math.min(50,Math.floor(50*900/x.measureText(s).width));x.font=`400 ${fs}px ${SERIF}`;
  const sp=x.measureText(' ').width,ws=words.map(w=>x.measureText(w).width);
  let tot=ws.reduce((a,b)=>a+b,0)+sp*(words.length-1),px=W/2-tot/2;x.restore();
  words.forEach((w,i)=>{const p=eo(prog(t,at+i*.12,.5));text(w,px,y+(1-p)*10,{size:fs,align:'left',alpha:p});px+=ws[i]+sp});
}
function note(t,s,at,y=965,color=C.mid){text(s,W/2,y,{size:26,font:SANS,weight:500,color,alpha:eo(prog(t,at,.6))})}
function check(cx,cy,s,p,color=C.green,lw=6){
  if(p<=0)return;sk(lineP(cx-.32*s,cy+.02*s,cx-.1*s,cy+.24*s,cx+.34*s,cy-.22*s),p,{c:color,lw,amp:.4});
}

// ——— bölümler ———
const S=[];

// 1. Her gün küçük bir kare
S.push({d:6.5,f(t){
  const p=eio(prog(t,.2,1.4)),r=-.05;
  sk(rectP(540,430,200,200,18,r),p,{lw:5,fill:C.orange,fa:eo(prog(t,1.5,.8)),seed:3});
  // güneş gibi küçük ışınlar: gün başlıyor
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2,q=eo(prog(t,2.2+i*.06,.5));
    sk(lineP(540+Math.cos(a)*150,430+Math.sin(a)*150,540+Math.cos(a)*(150+40*q),430+Math.sin(a)*(150+40*q)),q>0?1:0,{c:C.orange,lw:5,amp:.3,alpha:q})}
  caption(t,'Her gün küçük bir kare gibi başlar.',2);
}});

// 2. Çoğu geçip gider
S.push({d:6.5,f(t){
  const s=96,g=30,ox=540-3*(s+g);
  for(let i=0;i<7;i++){
    const cx=ox+i*(s+g),mine=i===3;
    const ap=eio(prog(t,.2+Math.abs(i-3)*.18,.9));
    const fade=mine?0:eo(prog(t,2.6+i*.12,1.2));
    const dy=fade*30*(i%2?1:-1);
    sk(rectP(cx,430+dy,s,s,12,(i-3)*.03),mine?1:ap,{lw:4,fill:mine?C.orange:C.soft,fa:mine?1:ap*.9,seed:i+2,alpha:1-fade*.85,c:mine?C.ink:C.mid});
  }
  // kaybolanları gösteren kesik iz
  caption(t,'Çoğu, biz fark etmeden geçip gider.',1.3);
}});

// 3. ONE doğdu (v3)
S.push({d:7,f(t){
  const p=eio(prog(t,.1,1.6));
  sk(rectP(540,420,300,540,48),p,{lw:5,seed:7});
  sk(lineP(500,178,580,178),eio(prog(t,1.3,.4)),{lw:5,amp:.3});
  const q=eo(prog(t,1.6,.8));
  x.save();x.translate(540,390);x.scale(.6+.4*back(q),.6+.4*back(q));x.translate(-540,-390);
  sk(rectP(540,390,150,150,16,.04),q>0?1:0,{lw:4,fill:C.orange,fa:q,seed:9,alpha:q});
  x.restore();
  // nota
  const n=prog(t,2.4,1);
  sk(circP(522,425,14,0,Math.PI*2,11),n*3,{lw:4,c:C.bg,fill:C.bg,fa:eo(prog(t,2.6,.3)),seed:1,amp:.3});
  sk(lineP(535,423,535,355),n*2-.5,{lw:5,c:C.bg,amp:.3});
  sk(lineP(535,355,560,368,566,392),n*2-1,{lw:5,c:C.bg,amp:.3});
  text('günün şarkısı',540,530,{size:26,font:SANS,weight:500,color:C.ink,alpha:eo(prog(t,3,.6))});
  caption(t,'ONE, o kareleri tutmak için doğdu.',2.8);
  note(t,'v3 · her gün bir şarkı, bir an',3.8);
}});

// 4. Günün tamamı
S.push({d:8,f(t){
  const xs=[180,420,660,900],y=420,L=['Sabah','Check-in','Günlük','Akşam'];
  // ufuk çizgisi hepsini bağlar
  sk(lineP(70,y+90,1010,y+90),eio(prog(t,.1,1.4)),{lw:3,c:C.mid,amp:.6});
  // sabah: yükselen güneş
  let a=prog(t,.6,1.2);
  x.save();x.beginPath();x.rect(0,0,W,y+88);x.clip();
  const sy=y+90-70*eo(a);
  sk(circP(xs[0],sy,48),eio(a),{lw:4,fill:C.orange,fa:eo(prog(t,1.4,.6)),seed:2});x.restore();
  for(let i=0;i<5;i++){const an=Math.PI+(i+.5)/5*Math.PI,q=eo(prog(t,1.8+i*.06,.4));
    sk(lineP(xs[0]+Math.cos(an)*66,sy+Math.sin(an)*66,xs[0]+Math.cos(an)*(66+22*q),sy+Math.sin(an)*(66+22*q)),q>0?1:0,{c:C.orange,lw:4,amp:.2,alpha:q})}
  // check-in: 1–5 ölçek, biri seçilir
  for(let i=0;i<5;i++){const q=eio(prog(t,1.6+i*.12,.6)),sel=i===3,pick=eo(prog(t,2.9,.4));
    const r=sel?16+6*back(pick):14;
    sk(circP(xs[1]-80+i*40,y+10,r),q,{lw:3.5,fill:sel?C.blue:null,fa:sel?pick:0,seed:i,c:sel&&pick>0?C.blue:C.ink})}
  // günlük: sayfa + yazılan satırlar
  sk(rectP(xs[2],y,140,170,10,.03),eio(prog(t,2.6,1)),{lw:4,fill:'#fff',fa:eo(prog(t,3.3,.4)),seed:5});
  for(let i=0;i<4;i++){const q=eio(prog(t,3.5+i*.35,.4));sk(lineP(xs[2]-48,y-40+i*28,xs[2]+(i===3?10:48),y-40+i*28),q,{lw:3,c:i?C.mid:C.ink,amp:.8,seed:i+4})}
  // akşam: hilal
  const m=eio(prog(t,4.2,1.2));
  sk(circP(xs[3],y+10,52),m,{lw:4,c:C.blue,fill:C.blue,fa:eo(prog(t,5,.5)),seed:8});
  const bite=eo(prog(t,5.2,.7));
  sk(circP(xs[3]+lerp(90,26,bite),y-8,46),bite>0?1:0,{lw:4,c:C.bg,fill:C.bg,fa:1,seed:9,amp:.5});
  for(let i=0;i<3;i++){const q=eo(prog(t,5+i*.15,.4));sk(circP(xs[3]-60+i*55,y-70-(i%2)*20,4),q>0?1:0,{lw:3,fill:C.blue,fa:q,alpha:q,amp:.2})}
  L.forEach((l,i)=>text(l,xs[i],y+150,{size:28,font:SANS,weight:500,color:C.ink,alpha:eo(prog(t,.8+i*1.1,.6))}));
  caption(t,'Şimdi günün tamamına eşlik etmek istiyoruz.',5);
  note(t,'ONE 2.0 · ritüel, check-in, günlük, seri',6);
}});

// 5. Eski anılar güvende
S.push({d:7.5,f(t){
  const bx=540,by=470,bw=320,bh=220;
  // düşen kareler
  const r=rng(5);
  for(let i=0;i<9;i++){const d=1.1+i*.16,q=prog(t,d,.7),fall=q*q;
    const tx=bx-110+(i%5)*55+(i>4?27:0),ty=by+40-(i>4?40:0);
    const cx=lerp(tx+(r()-.5)*200,tx,eo(q)),cy=lerp(170,ty,fall);
    if(q>0)sk(rectP(cx,cy,42,42,6,(r()-.5)*.5*(1-q)),1,{lw:3,fill:i%3?C.mid:C.orange,fa:1,seed:i,amp:.4,alpha:eo(clamp(q*4))})}
  sk(lineP(bx-bw/2,by-bh/2,bx-bw/2,by+bh/2,bx+bw/2,by+bh/2,bx+bw/2,by-bh/2),eio(prog(t,.1,1.3)),{lw:5,fill:C.soft,fa:eo(prog(t,.9,.6)),seed:4});
  // kapak kapanır
  const lp=eio(prog(t,3,.9)),ang=lerp(-1.2,0,lp);
  x.save();x.translate(bx-bw/2,by-bh/2);x.rotate(ang);
  sk(rectP(bw/2,-8,bw+16,16,6),lp>0?1:0,{lw:5,fill:C.bg,fa:1,seed:6,amp:.6});x.restore();
  // kilit
  const k=eio(prog(t,3.9,.8));
  sk(circP(bx,by+2,24,Math.PI,Math.PI*2),k,{lw:5,c:C.orange,amp:.4});
  sk(rectP(bx,by+34,64,50,10),k,{lw:5,fill:C.orange,fa:eo(prog(t,4.5,.4)),c:C.orange,amp:.4});
  caption(t,'Eski anılar ise olduğu yerde, güvende kalır.',3.4);
  note(t,'DailySong ve eski model sürümlerine dokunulmaz',4.6);
}});

// 6. Önce plan
S.push({d:7.5,f(t){
  const P=[['AUDIT','v3 envanteri'],['Veri modeli','varlıklar'],['MIGRATION','taşıma: B′'],['ADR-001','mimari']];
  P.forEach(([h,sub],i)=>{
    const cx=225+i*210,cy=440,rot=[-.06,.03,-.02,.05][i],d=.2+i*.45,q=eo(prog(t,d,.6));
    if(q<=0)return;
    x.save();x.globalAlpha=q;x.translate(cx,cy+(1-q)*60);x.rotate(rot);
    sk(rectP(0,0,180,240,10),1,{lw:4,fill:'#fff',fa:1,seed:i+1,amp:.8});
    text(h,0,-66,{size:24,font:SANS,weight:600});
    text(sub,0,-34,{size:18,font:SANS,weight:400,color:C.mid});
    for(let k=0;k<3;k++)sk(lineP(-60,0+k*24,k===2?20:60,0+k*24),eio(prog(t,d+.4+k*.12,.4)),{lw:3,c:C.soft,amp:.6,seed:k});
    x.restore();
    check(cx,cy+86,60,eio(prog(t,2.4+i*.3,.5)));
  });
  caption(t,'Önce dinledik, denetledik, plan yaptık.',3.4);
  note(t,'Faz 0 · 23 Eylül 2026’da kapandı',4.6);
}});

// 7. Temel taş taş
S.push({d:8.5,f(t){
  const E=['İçerik','Söz','Maruz kalma','Soru','Tema','Yankı','Öneri','Gün ve seri','Rozet','İçgörü','Arama','Profil','Bildirim','Widget'];
  const rows=[4,4,3,3],bw=200,bh=70,base=610;let k=0;
  const cols=[C.orange,C.blue,C.green,C.soft];
  sk(lineP(90,base+bh/2+8,990,base+bh/2+8),eio(prog(t,.1,1)),{lw:4,c:C.ink,amp:.5});
  rows.forEach((n,r)=>{for(let j=0;j<n;j++){
    const i=k++,cx=540+(j-(n-1)/2)*(bw+12),cy=base-r*(bh+12),d=.6+i*.24,q=prog(t,d,.5);
    if(q<=0)continue;
    const yy=lerp(cy-260,cy,1-Math.pow(1-q,3)),bounce=q>=1?0:0;
    sk(rectP(cx,yy+bounce,bw,bh,10),1,{lw:3.5,fill:cols[i%4],fa:i%4===3?1:.35,seed:i,amp:.7});
    text(E[i],cx,yy+9,{size:22,font:SANS,weight:500});
  }});
  caption(t,'Sonra temeli taş taş kurduk.',4.4);
  note(t,'Batuhan ve Claude · 14 motor, ilk 10 işin 9’u',5.4);
}});

// 8. Her gün bir kare daha
S.push({d:8,f(t){
  const s=100,g=26,ox=540-3*(s+g),y=380,days=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];let n=0;
  days.forEach((d,i)=>{
    const cx=ox+i*(s+g),ap=eio(prog(t,.1+i*.08,.8)),fp=prog(t,1+i*.42,.45);
    text(d,cx,y-s/2-22,{size:22,font:SANS,weight:500,color:C.mid,alpha:ap});
    x.save();if(fp>0){const sc=.85+.15*back(fp);x.translate(cx,y);x.scale(sc,sc);x.translate(-cx,-y)}
    sk(rectP(cx,y,s,s,12,(i%2?.03:-.03)),ap,{lw:4,fill:C.orange,fa:eo(fp),seed:i+3});x.restore();
    if(fp>0)n=i+1;
  });
  const na=eo(prog(t,1,.4));
  text(String(n),500,640,{size:150,font:SERIF,weight:500,align:'right',alpha:na});
  text('gün üst üste',520,620,{size:44,font:SERIF,italic:true,align:'left',color:C.ink,alpha:na});
  // rozet
  const b=prog(t,4.2,1);
  sk(circP(540,745,34),eio(b),{lw:4,c:C.orange,fill:C.orange,fa:eo(prog(t,4.8,.4)),seed:2});
  sk(lineP(522,775,510,810,528,800,540,812),eio(prog(t,4.6,.5)),{lw:4,c:C.orange,amp:.3});
  sk(lineP(558,775,570,810,552,800,540,812),eio(prog(t,4.6,.5)),{lw:4,c:C.orange,amp:.3});
  caption(t,'Her gün, bir kare daha.',5.2);
}});

// 9. Hikâye yeni başlıyor
S.push({d:8,f(t){
  // ufka giden kare yolu
  sk(lineP(60,560,1020,560),eio(prog(t,.1,1.2)),{lw:3,c:C.mid,amp:.5});
  for(let i=0;i<9;i++){
    const f=i/8,s=lerp(110,20,Math.pow(f,.7)),cx=lerp(200,760,Math.pow(f,.8)),cy=lerp(820,572,Math.pow(f,.6));
    const q=eo(prog(t,.4+i*.15,.5));
    sk(rectP(cx,cy,s,s*.55,Math.max(3,s*.1)),q,{lw:Math.max(2,4-f*2),fill:i<3?C.orange:C.soft,fa:q,seed:i,amp:.6});
  }
  const a=eo(prog(t,2,.9));
  text('ONE 2.0',540,330+(1-a)*14,{size:120,font:SANS,weight:600,alpha:a,ls:-3});
  sk(lineP(360,370,720,370),eio(prog(t,2.6,.9)),{lw:5,c:C.orange,amp:.8});
  caption(t,'Hikâye yeni başlıyor.',3.4,445);
  note(t,'Sırada: ekran spesifikasyonu',4.4,1000,C.ink);
}});

// ——— zaman çizelgesi ———
const total=S.reduce((a,s)=>a+s.d,0),FADE=.45;
function draw(time){
  BOIL=Math.floor(time*8); // saniyede 8 kez hafif titreşim
  x.fillStyle=C.bg;x.fillRect(0,0,W,H);
  let t=time,k=0;while(k<S.length-1&&t>=S[k].d){t-=S[k].d;k++}
  S[k].f(t);
  // üst künye: ONE 2.0 · bölüm sayacı
  text('ONE 2.0',72,84,{size:24,font:SANS,weight:600,align:'left',color:C.ink,alpha:.85});
  text(`${String(k+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}`,1008,84,{size:22,font:SANS,weight:500,align:'right',color:C.mid});
  // bölüm ilerleme çizgisi
  x.fillStyle=C.soft;x.fillRect(72,104,936,3);x.fillStyle=C.orange;x.fillRect(72,104,936*clamp(time/total),3);
  // geçiş: kreme yumuşak kararma
  let f=0;if(k<S.length-1&&t>S[k].d-FADE)f=prog(t,S[k].d-FADE,FADE);if(k>0&&t<FADE)f=1-prog(t,0,FADE);
  if(time>total-.8)f=Math.max(f,prog(time,total-.8,.8));
  if(f>0){x.fillStyle=C.bg;x.globalAlpha=eio(f);x.fillRect(0,120,W,H-120);x.globalAlpha=1}
}
window.TOTAL=total;window.draw=draw;
window.ready=document.fonts.ready.then(()=>Promise.all([
 "400 40px 'Lora'","italic 400 40px 'Lora'","500 40px 'Lora'","400 40px 'Poppins'","500 40px 'Poppins'","600 40px 'Poppins'"
].map(f=>document.fonts.load(f,'AğşıİçöüÇŞÖÜâ′'))));
</script></body></html>
